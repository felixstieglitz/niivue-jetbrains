<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Niivue Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #ccc;
            font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
        }
        #gl {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 12px;
            pointer-events: none;
            text-shadow: 0 0 4px #000;
        }
    </style>
</head>
<body>
    <canvas id="gl"></canvas>
    <div id="status">Initializing...</div>

    <script>// @@NIIVUE_BUNDLE_INJECTION_POINT@@</script>

    <script>
        (function () {
            const canvas = document.getElementById('gl');
            const status = document.getElementById('status');

            const nv = new niivue.Niivue({
                isResizeCanvas: true,
                isHighResolutionCapable: true,
                show3Dcrosshair: true,
                isOrientCube: true,
                logLevel: 'warn',
                multiplanarLayout: niivue.MULTIPLANAR_TYPE.GRID,
                multiplanarForceRender: true,
            });
            window.nv = nv;
            nv.attachToCanvas(canvas);

            // Scroll wheel support is intentionally disabled for now: JCEF
            // delivers macOS trackpad scrolling as a raw un-coalesced event
            // stream, and Niivue quantizes each event to a full ±1 slice step,
            // which produces back-and-forth jitter. Until a satisfying scroll
            // implementation lands, swallow all wheel events before Niivue's
            // own listener sees them. Navigation works via click and drag.
            window.addEventListener('wheel', function (e) {
                e.preventDefault();
                e.stopPropagation();
            }, { capture: true, passive: false });

            new ResizeObserver(() => nv.resizeListener()).observe(canvas);

            window.loadNiivueVolume = async function (base64, name) {
                try {
                    status.textContent = 'Loading ' + name + '...';
                    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                    await nv.loadFromArrayBuffer(bytes.buffer, name);
                    status.textContent = '';
                } catch (err) {
                    status.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
                    console.error('[Niivue] load failed:', err);
                }
            };

            status.textContent = '';
        })();
    </script>
</body>
</html>
