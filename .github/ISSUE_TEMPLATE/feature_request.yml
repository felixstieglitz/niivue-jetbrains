name: Feature request
description: Suggest an improvement or a new capability
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case — what are you trying to do that the plugin doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: If you have an idea how it could work, sketch it here. Pointers to how Niivue or the VSCode extension handle it are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
